name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Axpense.sln
      - run: dotnet build Axpense.sln --no-restore -c Release
      - run: dotnet test tests/Axpense.Tests/Axpense.Tests.csproj --no-build -c Release --logger "console;verbosity=normal"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build with the default SITE_URL (https://axpense.net) so canonicals/hreflang are production URLs.
      - run: npm run build

      - name: Start production server
        run: |
          nohup npx next start -p 3000 > next-start.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000 && exit 0
            sleep 1
          done
          echo "next start did not respond on :3000 within 60s" >&2
          exit 1

      - name: SEO audit (titles, canonicals, hreflang, sitemap, JSON-LD, links)
        run: node --experimental-strip-types scripts/seo-audit.ts
        env:
          AUDIT_BASE: http://localhost:3000

      # Lighthouse CI against the already-running server (see lighthouserc.json for budgets).
      # Core Web Vitals budgets: LCP <= 3000 ms, CLS <= 0.1, TBT <= 300 ms.
      # INP cannot be measured in lab navigation mode: it is covered by TBT (lab proxy) here
      # and by field data (CrUX) in Search Console's Core Web Vitals report.
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t axpense-api ./backend
      - run: docker build -t axpense-web .
